name: Lexical field report

# Regenerates docs/index.html (which fields of lully/words.py still need
# words) and docs/candidates.html (a big searchable pool of candidate
# words from the French Wiktionary, minus whatever's already in the
# corpus) whenever the corpus or either script changes on main, and
# commits the result back.
#
# One-time setup: in the repo's Settings > Pages, set "Source" to
# "Deploy from a branch", branch "main", folder "/docs".

"on":
  push:
    branches: [main]
    paths:
      - "lully/words.py"
      - "lexical_report.py"
      - "candidate_browser.py"
      - "candidate_words.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate lexical field report
        run: python lexical_report.py --words lully/words.py --out docs/index.html

      - name: Generate candidate words page
        run: python candidate_browser.py --words lully/words.py --candidates candidate_words.json --out docs/candidates.html

      - name: Commit reports if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/candidates.html
          git diff --cached --quiet || git commit -m "docs: regenerate lexical reports"
          git push
